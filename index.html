<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DERIV — Trader's Hub & Binary Terminal</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg-app: #f4f5f6;
      --bg-surface: #ffffff;
      --bg-dark: #0f1115;
      --bg-dark-elevated: #1b1e24;
      --text-primary: #14171a;
      --text-secondary: #5c6470;
      --text-muted: #8b93a0;
      --text-inverse: #ffffff;
      --accent-red: #ff444f;
      --accent-red-hover: #e63540;
      --accent-green: #00a79e;
      --accent-amber: #ff9c13;
      --border-light: #e4e7ec;
      --border-dark: #2a2f38;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 999px;
      --shadow-card: 0 4px 16px rgba(15, 17, 21, 0.05);
      --nav-height: 68px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-primary);
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--bg-app);
      position: relative;
      padding-bottom: calc(var(--nav-height) + 24px);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
    }

    .hidden {
      display: none !important;
    }

    /* Top Utility Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background-color: var(--bg-app);
      padding: 12px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid rgba(20, 23, 26, 0.06);
    }

    .top-bar.dark-mode {
      background-color: var(--bg-dark);
      border-bottom-color: var(--border-dark);
      color: var(--text-inverse);
    }

    .top-left-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sk-settings-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-light);
      background-color: #e9ecf0;
      color: var(--text-primary);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
