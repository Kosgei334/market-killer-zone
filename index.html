<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DERIV — Trader's Hub & Binary Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg-canvas: #f5f6f8;
    --bg-surface: #ffffff;
    --bg-surface-soft: #f0f2f5;
    --bg-dark: #111316;
    --bg-dark-elevated: #1c1f24;
    --bg-dark-hover: #262a31;
    --text-primary: #181c20;
    --text-secondary: #5e6670;
    --text-muted: #8c95a0;
    --text-on-dark: #ffffff;
    --text-on-dark-muted: #a3abb6;
    --brand-red: #ff444f;
    --brand-red-hover: #e63641;
    --brand-red-soft: rgba(255, 68, 79, 0.12);
    --brand-teal: #00a79e;
    --brand-amber: #ff9c13;
    --border-light: #e4e7ec;
    --border-dark: #2a2f37;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-pill: 999px;
    --shadow-sm: 0 2px 8px rgba(17, 19, 22, 0.05);
    --shadow-md: 0 8px 24px rgba(17, 19, 22, 0.08);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: var(--font-sans);
    background-color: var(--bg-canvas);
    color: var(--text-primary);
    line-height: 1.45;
    min-height: 100vh;
    overflow-x: hidden;
  }

  button, input, select {
    font-family: inherit;
  }

  button {
    cursor: pointer;
    border: none;
    background: transparent;
  }

  .app-shell {
    display: flex;
    min-height: 100vh;
    width: 100%;
  }

  /* Desktop Left Navigation Rail */
  .desktop-sidebar {
    display: none;
    width: 224px;
    flex-shrink: 0;
    background: var(--bg-surface);
    border-right: 1px solid var(--border-light);
    flex-direction: column;
    justify-content: space-between;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 40;
  }

  .sidebar-brand-top {
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-lockup {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-wordmark {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--brand-red);
    text-transform: uppercase;
  }

  .sidebar-nav-list {
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-nav-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    transition: all 0.16s ease;
    text-align: left;
  }

  .sidebar-nav-btn:hover {
    background: var(--bg-surface-soft);
    color: var(--text-primary);
  }

  .sidebar-nav-btn.active {
    background: var(--brand-red-soft);
    color: var(--brand-red);
  }

  .sidebar-footer {
    padding: 14px;
    border-top: 1px solid var(--border-light);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .mode-pill-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--bg-surface-soft);
    padding: 3px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border-light);
  }

  .mode-pill-btn {
    padding: 6px 8px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    transition: all 0.15s ease;
  }

  .mode-pill-btn.active.demo {
    background: var(--brand-amber);
    color: #111316;
  }

  .mode-pill-btn.active.real {
    background: var(--brand-red);
    color: #ffffff;
  }

  .sidebar-balance-box {
    background: var(--bg-surface-soft);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-balance-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .sidebar-balance-val {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }

  /* Main Workspace Column */
  .main-column {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding-bottom: 84px;
  }

  /* Top Dark Header matching screenshot layout */
  .top-dark-header {
    background: var(--bg-dark);
    color: var(--text-on-dark);
    padding: 12px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 35;
    border-bottom: 1px solid var(--border-dark);
  }

  .top-header-row {
    max-width: 1480px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .header-left-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .avatar-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--bg-dark-elevated);
    border: 1px solid var(--border-dark);
    color: var(--text-on-dark);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }

  .avatar-btn:hover {
    background: var(--bg-dark-hover);
  }

  .icon-circle-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--bg-dark-elevated);
    border: 1px solid var(--border-dark);
    color: var(--text-on-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: background 0.15s ease;
  }

  .icon-circle-btn:hover {
    background: var(--bg-dark-hover);
  }

  .ask-amy-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    padding: 0 15px;
    border-radius: var(--radius-pill);
    background: var(--bg-dark-elevated);
    border: 1px solid #343a44;
    color: var(--text-on-dark);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    transition: all 0.15s ease;
  }

  .ask-amy-pill:hover {
    background: var(--bg-dark-hover);
    border-color: #4a5260;
  }

  .ask-amy-spark {
    color: #c084fc;
    font-size: 14px;
    line-height: 1;
  }

  .header-right-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .notif-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border-radius: var(--radius-pill);
    background: var(--brand-red);
    color: #ffffff;
    font-size: 10px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg-dark);
  }

  .desktop-header-controls {
    display: none;
    align-items: center;
    gap: 10px;
  }

  .desktop-acct-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-dark-elevated);
    border: 1px solid var(--border-dark);
    padding: 5px 12px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 700;
  }

  .desktop-acct-chip .bal {
    color: var(--text-on-dark);
    font-variant-numeric: tabular-nums;
  }

  .reset-demo-chip {
    background: rgba(255, 156, 19, 0.16);
    color: var(--brand-amber);
    border: 1px solid rgba(255, 156, 19, 0.35);
    border-radius: var(--radius-pill);
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
  }

  /* Content Container */
  .view-container {
    max-width: 1480px;
    width: 100%;
    margin: 0 auto;
    padding: 0 0 24px;
  }

  .view-section {
    display: none;
  }

  .view-section.active {
    display: block;
  }

  /* Dark Hero Card (Make your first deposit + red candlesticks chart icon) */
  .hero-dark-wrapper {
    background: var(--bg-dark);
    padding: 6px 14px 20px;
    border-bottom-left-radius: 22px;
    border-bottom-right-radius: 22px;
  }

  .hero-dark-card {
    max-width: 1452px;
    margin: 0 auto;
    background: linear-gradient(135deg, #16191e 0%, #1d2128 60%, #24181c 100%);
    border: 1px solid var(--border-dark);
    border-radius: var(--radius-lg);
    padding: 22px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: var(--shadow-md);
  }

  .hero-copy {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    max-width: 540px;
  }

  .hero-title {
    color: var(--text-on-dark);
    font-size: 26px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }

  .hero-subtitle {
    color: var(--text-on-dark-muted);
    font-size: 13px;
  }

  .hero-carousel-dots {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .hero-dot {
    height: 4px;
    border-radius: 99px;
    background: #3d434d;
    transition: all 0.2s ease;
  }

  .hero-dot.active {
    width: 34px;
    background: var(--brand-teal);
  }

  .hero-dot:not(.active) {
    width: 24px;
  }

  .btn-deposit-red {
    background: var(--brand-red);
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    padding: 11px 22px;
    border-radius: var(--radius-pill);
    box-shadow: 0 4px 14px rgba(255, 68, 79, 0.35);
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .btn-deposit-red:hover {
    background: var(--brand-red-hover);
  }

  .btn-deposit-red:active {
    transform: scale(0.98);
  }

  /* Ways to deposit strip */
  .ways-strip-wrap {
    padding: 14px 16px 8px;
  }

  .ways-strip-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    overflow-x: auto;
    scrollbar-width: none;
    box-shadow: var(--shadow-sm);
  }

  .ways-strip-card::-webkit-scrollbar {
    display: none;
  }

  .ways-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .way-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-surface-soft);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }

  .way-pill:hover {
    border-color: #cbd2dc;
    background: #e8ebef;
  }

  .way-dusu-tag {
    font-size: 10px;
    font-weight: 800;
    background: linear-gradient(90deg, #7c3aed, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Section Headings & Cards */
  .hub-section {
    padding: 14px 16px 4px;
  }

  .hub-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .hub-section-title {
    font-size: 18px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }

  .hub-section-link {
    font-size: 13px;
    font-weight: 700;
    color: var(--brand-red);
  }

  /* My trading accounts (Options & TradingView cards) */
  .accounts-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .trading-acct-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
    text-align: left;
  }

  .trading-acct-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: #d0d7e2;
  }

  .acct-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .acct-badge-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
  }

  .acct-badge-options {
    background: linear-gradient(135deg, #ff5862, #e12d39);
    color: #ffffff;
  }

  .acct-badge-tv {
    background: #111316;
    color: #ffffff;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: -0.03em;
  }

  .acct-badge-cfd {
    background: #eef2f6;
    color: var(--text-primary);
  }

  .acct-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .acct-balance {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }

  .acct-balance span {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin-left: 2px;
  }

  /* Dismissible Alert Banner ("ANT has entered the chart") */
  .alert-banner-dark {
    background: var(--bg-dark);
    color: var(--text-on-dark);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: var(--shadow-sm);
  }

  .alert-banner-text {
    font-size: 15px;
    font-weight: 800;
    line-height: 1.25;
  }

  .alert-banner-sub {
    font-size: 12px;
    color: var(--text-on-dark-muted);
    font-weight: 500;
    margin-top: 2px;
  }

  .alert-close-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg-dark-elevated);
    color: var(--text-on-dark-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
  }

  /* Market Watch & Quick Trade Cards */
  .markets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }

  .market-tile {
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-md);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: var(--shadow-sm);
  }

  .market-tile-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .market-symbol {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-primary);
  }

  .market-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: var(--radius-pill);
    background: var(--bg-surface-soft);
    color: var(--text-secondary);
  }

  .market-price-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .market-price {
    font-size: 16px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .chg-pos {
    color: var(--brand-teal);
    font-size: 12px;
    font-weight: 700;
  }

  .chg-neg {
    color: var(--brand-red);
    font-size: 12px;
    font-weight: 700;
  }

  /* Bottom Navigation Bar (Home, CFDs, Exchange, Options, Portfolio) */
  .bottom-nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 64px;
    background: var(--bg-surface);
    border-top: 1px solid var(--border-light);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    z-index: 45;
    box-shadow: 0 -4px 16px rgba(17, 19, 22, 0.05);
  }

  .bottom-nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-secondary);
    transition: color 0.15s ease;
  }

  .bottom-nav-btn.active {
    color: var(--brand-red);
  }

  .dxn-badge {
    border: 1.5px solid currentColor;
    border-radius: 4px;
    padding: 0 3px;
    font-size: 9px;
    font-weight: 900;
    line-height: 1.25;
  }

  /* Options / TradingView Terminal Workspace */
  .terminal-shell {
    background: var(--bg-dark);
    color: var(--text-on-dark);
    min-height: calc(100vh - 60px);
    padding: 14px 16px 28px;
  }

  .terminal-top-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--bg-dark-elevated);
    border: 1px solid var(--border-dark);
    border-radius: var(--radius-lg);
    padding: 10px 14px;
    margin-bottom: 14px;
  }

  .symbol-picker-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .dark-select {
    background: var(--bg-dark);
    color: var(--text-on-dark);
    border: 1px solid var(--border-dark);
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    font-size: 13px;
    font-weight: 700;
  }

  .live-spot-box {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .live-spot-price {
    font-size: 17px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .tf-pill-group {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-dark);
    padding: 3px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-dark);
  }

  .tf-btn {
    padding: 5px 9px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-on-dark-muted);
  }

  .tf-btn.active {
    background: var(--bg-dark-elevated);
    color: var(--text-on-dark);
  }

  .terminal-main-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 14px;
    align-items: start;
  }

  .chart-panel {
    background: var(--bg-dark-elevated);
    border: 1px solid var(--border-dark);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .chart-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-dark);
    flex-wrap: wrap;
    gap: 8px;
  }

  .chart-type-pills {
    display: flex;
    gap: 6px;
  }

  .chart-type-btn {
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-on-dark-muted);
    background: var(--bg-dark);
    border: 1px solid var(--border-dark);
  }

  .chart-type-btn.active {
    color: #ffffff;
    border-color: var(--brand-red);
    background: rgba(255, 68, 79, 0.16);
  }

  #tvChartContainer {
    width: 100%;
    height: 410px;
  }

  .order-ticket-panel {
    background: var(--bg-dark-elevated);
    border: 1px solid var(--border-dark);
    border-radius: var(--radius-lg);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .contract-tabs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    background: var(--bg-dark);
    padding: 4px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-dark);
  }

  .contract-tab-btn {
    padding: 8px 6px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-on-dark-muted);
  }

  .contract-tab-btn.active {
    background: var(--bg-dark-elevated);
    color: #ffffff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }

  .ticket-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .ticket-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-on-dark-muted);
    display: flex;
    justify-content: space-between;
  }

  .ticket-input-wrap {
    display: flex;
    align-items: center;
    background: var(--bg-dark);
